# Installeurs Windows (NSIS, Python embarqué), macOS (.dmg) et Linux (AppImage) à chaque
# étiquette vX.Y.Z. La signature n'a lieu que si les secrets correspondants
# sont définis dans le dépôt (sinon : installeurs non signés).
#
# Secrets facultatifs :
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD        (Authenticode, osslsigncode)
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
#   MACOS_SIGN_IDENTITY ("Developer ID Application: …"),
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD           (notarisation)
#   APPIMAGE_GPG_KEY_BASE64                               (signature AppImage)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: macos
          - os: ubuntu-22.04
            kind: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[astro,ia,raw]" pyinstaller
      - name: Exécutable PyInstaller
        run: python packaging/build.py
      - name: macOS — signature, notarisation, dmg
        if: matrix.kind == 'macos'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/build_dmg.sh
      - name: Linux — AppImage
        if: matrix.kind == 'linux'
        env:
          APPIMAGE_GPG_KEY_BASE64: ${{ secrets.APPIMAGE_GPG_KEY_BASE64 }}
        run: bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.kind }}
          path: packaging/out/*

  # Windows : installeur NSIS construit sous Linux (Python embarqué, roues
  # Windows), puis installé et vérifié sur une vraie machine Windows.
  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis mingw-w64 zip osslsigncode python3.12
          python3 -m pip install --user uv
      - name: Certificat (facultatif)
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            echo "WINDOWS_CERT_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          fi
      - name: Installeur et version portable
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: bash packaging/windows/build_windows.sh --portable
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: packaging/out/*

  windows-test:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: out
      - name: Installation silencieuse, vérification, désinstallation
        shell: pwsh
        run: |
          $setup = Get-ChildItem out\*-windows-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S","/CurrentUser" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\AstroForge"
          if (-not (Test-Path "$dir\AstroForge.exe")) { throw "Installation absente" }
          $env:QT_QPA_PLATFORM = "offscreen"
          & "$dir\astroforge-cli.exe" info
          if ($LASTEXITCODE -ne 0) { throw "astroforge-cli info : $LASTEXITCODE" }
          & "$dir\astroforge-cli.exe" script "$dir\check_install.py"
          if ($LASTEXITCODE -ne 0) { throw "check_install : $LASTEXITCODE" }
          $p = Start-Process "$dir\AstroForge.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "AstroForge.exe --selftest : $($p.ExitCode)" }
          Start-Process "$dir\Uninstall.exe" -ArgumentList "/CurrentUser","/S" -Wait
          Start-Sleep -Seconds 20
          if (Test-Path "$dir\python") { throw "Désinstallation incomplète" }

  publish:
    needs: [build, windows-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Manifeste de mise à jour (latest.json)
        run: python packaging/make_manifest.py out "${GITHUB_REF_NAME#v}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > out/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

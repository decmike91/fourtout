# Tests sur Windows, macOS et Linux à chaque push / pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliothèques système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1
      - name: Installation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[astro,raw,dev]"
      - name: Analyse statique (ruff)
        run: ruff check astroforge tests
      - name: Tests unitaires (pytest)
        run: python -m pytest -m "not slow"
      - name: Suite de bout en bout (smoke.py)
        run: python -m pytest -m slow
      - name: Démarrage de l'interface (selftest)
        run: python main.py --selftest
      - name: Ligne de commande
        run: |
          astroforge --version
          astroforge info

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
